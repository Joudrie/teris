<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101218">
  <title>Material Blocks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <b id="lvl">Level 1</b>
      <span class="next">Next <b id="nextName">Water</b> <canvas id="nx" width="56" height="42"></canvas></span>
    </div>
    <div class="goal">
      <div id="goal"></div>
      <div class="bar"><i id="goalBar"></i></div>
    </div>
    <div class="meter">
      <div class="meter-row"><span id="meterLabel">Power</span><button id="meterAd" hidden>Fill with ad</button></div>
      <div class="bar meter-bar"><i id="meterBar"></i></div>
    </div>
    <div class="banner" id="banner" hidden></div>
    <canvas id="cv" width="320" height="480" aria-label="Game board"></canvas>
    <div class="quest" id="quest"></div>
    <p class="hint">Swipe to move, drag down to drop, flick down to slam, tap to rotate, swipe up to use your power. Connect one material wall to wall to break it.</p>
    <div class="legend" id="legend"></div>
  </div>

  <div class="over" id="over" hidden>
    <h2 id="ovT"></h2>
    <div id="ovS"></div>
    <button id="ovA"></button>
    <button id="ovB"></button>
  </div>

  <div class="over ad" id="ad" hidden>
    <div class="ad-label"></div>
    <div class="ad-count"></div>
    <small>No ad network connected yet.</small>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
