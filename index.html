<body>
  <canvas id="world" aria-hidden="true"></canvas>

  <main id="game" class="game">
    <header class="hud-top">
      <button id="homeBtn" class="btn-ic" aria-label="Pause"></button>
      <div class="goal panel" id="goal" aria-label="Drain goal">
        <div class="goal-ic" id="goalIc"></div>
        <div class="goal-body">
          <div class="goal-bar"><i id="drainBar"></i></div>
          <div class="goal-num"><b class="t" id="drainNum">0</b><span class="t goal-of" id="drainGoal">/15</span><small>Goal</small></div>
        </div>
      </div>
      <div class="moves" id="moves" aria-label="Pieces left"><b class="t" id="left">0</b><small>Pieces</small></div>
    </header>

    <div class="wellwrap" id="wellwrap">
      <div class="well" id="well">
        <div class="plaque t" id="lvl">Level 1</div>
        <div class="banner" id="banner" hidden></div>
        <canvas id="cv" aria-label="Game board"></canvas>
        <button class="callout" id="callout" hidden></button>
      </div>
    </div>

    <footer class="hud-bottom">
      <div class="next panel" aria-label="Next piece"><span>Next</span><canvas id="nx"></canvas></div>
      <div class="quest panel" id="quest" aria-label="Side quest"></div>
      <div class="powerwrap">
        <button class="power" id="powerBtn" aria-label="Use power">
          <i id="meterBar"></i>
          <span class="power-face" id="powerIc"></span>
          <span class="tag t" id="meterLabel">Power</span>
        </button>
        <button class="meterad" id="meterAd" hidden></button>
      </div>
    </footer>
  </main>

  <div class="vignette" id="vignette" aria-hidden="true"></div>
  <canvas id="fxc" aria-hidden="true"></canvas>

  <section id="home" class="map" hidden aria-label="Tower map">
    <div class="map-scroll" id="mapScroll"></div>
    <div class="map-hud">
      <div class="pill" id="coinPill"></div>
      <div class="pill" id="starPill"></div>
      <span class="grow"></span>
      <button class="btn-ic" id="settingsBtn" aria-label="Settings"></button>
    </div>
    <div class="map-side">
      <button class="sidebtn" id="dailyBtn"><span class="sb-ic" id="dailyIc"></span><small class="t">Daily</small><em id="dailyInfo"></em></button>
      <button class="sidebtn" id="rewardsBtn"><span class="sb-ic" id="rewardsIc"></span><small class="t">Gifts</small><span class="badge" id="rewardsBadge" hidden>1</span></button>
      <button class="sidebtn" id="shopBtn"><span class="sb-ic" id="shopIc"></span><small class="t">Shop</small></button>
      <button class="sidebtn" id="codexBtn"><span class="sb-ic" id="codexIc"></span><small class="t">Blocks</small></button>
    </div>
    <div class="map-dock">
      <div class="boosters" id="boosters"></div>
      <button class="btn btn-green playbtn" id="playBtn"><span class="t" id="playLabel">Play</span><small id="homeLevel">Level 1</small></button>
    </div>
    <section id="playtest" class="playtest panel" hidden>
      <h2>Playtest results (this device only)</h2>
      <pre id="playtestSummary"></pre>
      <button id="playtestCopy" class="btn btn-blue small">Copy all attempts</button>
      <button id="playtestClear" class="btn btn-navy small">Clear</button>
    </section>
  </section>

  <div class="over" id="over" hidden>
    <div class="rays" aria-hidden="true"></div>
    <div class="over-body">
      <div class="ribbon t" id="ovT"></div>
      <div class="ov-sub t" id="ovSub"></div>
      <div class="stars" id="ovStars"></div>
      <div class="ring" id="ovRing" hidden><svg viewBox="0 0 120 120"><circle class="ring-bg" cx="60" cy="60" r="50"/><circle class="ring-fg" id="ovRingFg" cx="60" cy="60" r="50"/></svg><b class="t" id="ovPct">0%</b></div>
      <div class="card" id="ovCard">
        <div id="ovS"></div>
        <div class="nextup" id="ovN"></div>
      </div>
      <div class="ov-btns">
        <button id="ovB" class="btn btn-blue sq"></button>
        <button id="ovA" class="btn btn-green big"></button>
      </div>
      <button id="ovC" class="btn btn-gold wide"></button>
    </div>
  </div>

  <div class="over ad" id="ad" hidden>
    <div class="ad-card panel">
      <div class="ad-ring"><svg viewBox="0 0 120 120"><circle class="ring-bg" cx="60" cy="60" r="50"/><circle class="ring-fg" id="adRing" cx="60" cy="60" r="50"/></svg><b class="t ad-count"></b></div>
      <div class="ad-label t"></div>
      <small class="ad-note">Ad placeholder</small>
    </div>
  </div>

  <div class="sheet-wrap" id="sheet" hidden><div class="sheet panel" id="sheetBody" role="dialog" aria-modal="true"></div></div>
  <div class="intro" id="intro" hidden></div>
  <div class="toast" id="toast" aria-live="polite"></div>

  <script type="module" src="src/main.js?v=b79f9220d7"></script>
</body>
</html>
