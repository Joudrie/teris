<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand assets</title>
<style>
@font-face { font-family: 'Lilita One'; src: url(../../assets/fonts/LilitaOne.woff2) format('woff2'); }
body { margin: 0; background: #333; display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="icon" width="1024" height="1024" style="width:512px;height:512px"></canvas>
<canvas id="logo" width="1400" height="420" style="width:700px;height:210px"></canvas>
<script type="module">
import { previewTile } from '../../src/render/tiles.js';
import { TOYBOX } from '../../src/render/skins.js';
import { paintWorld } from '../../src/render/world.js';

await document.fonts.load('80px "Lilita One"');

// ---------- app icon: three tumbling blocks over the sky ----------
{
  const c = document.getElementById('icon').getContext('2d');
  const S = 1024;
  paintWorld(c, S, S, 92, 'toybox');
  const v = c.createRadialGradient(S / 2, S * 0.55, S * 0.2, S / 2, S * 0.55, S * 0.75);
  v.addColorStop(0, 'rgba(255,255,255,0.15)');
  v.addColorStop(1, 'rgba(13,22,64,0.35)');
  c.fillStyle = v;
  c.fillRect(0, 0, S, S);
  const block = (m, x, y, size, rot) => {
    c.save();
    c.translate(x, y);
    c.rotate(rot);
    c.shadowColor = 'rgba(13,22,64,0.45)';
    c.shadowBlur = size * 0.12;
    c.shadowOffsetY = size * 0.08;
    c.drawImage(previewTile(TOYBOX, m, size), -size / 2, -size / 2);
    c.restore();
  };
  // Fire glow behind the fire block.
  const g = c.createRadialGradient(S * 0.66, S * 0.66, 0, S * 0.66, S * 0.66, S * 0.36);
  g.addColorStop(0, 'rgba(255,170,60,0.6)');
  g.addColorStop(1, 'rgba(255,170,60,0)');
  c.fillStyle = g;
  c.fillRect(0, 0, S, S);
  block('wood', S * 0.32, S * 0.68, S * 0.36, -0.12);
  block('fire', S * 0.67, S * 0.67, S * 0.36, 0.1);
  block('water', S * 0.5, S * 0.31, S * 0.38, 0.22);
  // Steam puffs where water meets fire.
  c.fillStyle = 'rgba(255,255,255,0.85)';
  for (const [x, y, r] of [[0.6, 0.49, 0.05], [0.66, 0.47, 0.035], [0.55, 0.51, 0.03]]) { c.beginPath(); c.arc(S * x, S * y, S * r, 0, 7); c.fill(); }
}

// ---------- wordmark ----------
{
  const c = document.getElementById('logo').getContext('2d');
  const word = 'TUMBLEDOWN';
  const size = 190;
  c.font = `${size}px 'Lilita One'`;
  c.textBaseline = 'middle';
  c.lineJoin = 'round';
  const widths = [...word].map((ch) => c.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + (word.length - 1) * 6;
  let x = (1400 - total) / 2;
  const tilt = [-0.06, 0.04, -0.03, 0.05, -0.04, 0.03, 0.07, -0.05, 0.04, -0.06];
  const drop = [0, 10, 0, 8, -4, 14, 26, 40, 30, 48]; // the word tumbles down to the right
  const fills = [['#fffbe0', '#ffd84a', '#f29a0c'], ['#e8fdff', '#7fe8ff', '#1fa4f0']];
  [...word].forEach((ch, i) => {
    const w = widths[i];
    c.save();
    c.translate(x + w / 2, 190 + drop[i]);
    c.rotate(tilt[i]);
    c.lineWidth = 34;
    c.strokeStyle = '#0d1640';
    c.fillStyle = 'rgba(13,22,64,0.5)';
    c.fillText(ch, -w / 2, 18);
    c.strokeText(ch, -w / 2, 14);
    c.strokeText(ch, -w / 2, 0);
    const [a, b, d] = fills[i < 6 ? 0 : 1];
    const g = c.createLinearGradient(0, -size / 2, 0, size / 2);
    g.addColorStop(0, a); g.addColorStop(0.5, b); g.addColorStop(1, d);
    c.fillStyle = g;
    c.fillText(ch, -w / 2, 0);
    c.save();
    c.beginPath();
    c.rect(-w, -size * 0.5, w * 2, size * 0.28);
    c.clip();
    c.fillStyle = 'rgba(255,255,255,0.55)';
    c.fillText(ch, -w / 2, 0);
    c.restore();
    c.restore();
    x += w + 6;
  });
}
window.ready = true;
</script>
</body>
</html>
